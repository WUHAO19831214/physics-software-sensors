# Copy this file to .github/workflows/contracts.yml after granting the
# publishing credential GitHub's workflow scope.
name: contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/validate_repo.py
      - run: python -m pip install -e 'packages/python[color-marker,dev]'
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - run: npm --prefix packages/typescript ci
      - run: npm --prefix packages/typescript test
