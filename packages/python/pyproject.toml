[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-software-sensors"
version = "0.5.0"
description = "Reusable software sensors for physics experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WUHAO19831214" }]
dependencies = []

[project.optional-dependencies]
color-marker = [
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.9,<5",
]
camera-opencv = [
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.9,<5",
]
classical-trackers = [
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.9,<5",
]
yolo-recorded = [
  "numpy>=1.26,<3",
]
yolo-runtime = [
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.9,<5",
  "ultralytics>=8.2,<9",
  "lap>=0.5.12,<1",
]
dev = [
  "Markdown>=3.7,<4",
  "jsonschema>=4.23,<5",
  "Pillow>=11,<12",
  "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
